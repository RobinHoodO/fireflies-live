<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fireflies Live</title>
<style>
  :root { color-scheme: light; --line: oklch(0.92 0.006 255); --muted: oklch(0.55 0.015 255); --ac: oklch(0.585 0.16 242); }
  body { margin: 0; padding: 14px; font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: oklch(0.3 0.02 255); background: oklch(0.99 0.003 250); }
  h1 { margin: 0 0 2px; font-size: 15px; }
  p.sub { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
  ul { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li { border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; background: #fff; }
  .platform { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .title { margin: 2px 0 6px; font-weight: 600; word-break: break-word; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .bot-yes { color: oklch(0.5 0.14 155); }
  .bot-no { color: oklch(0.6 0.13 70); }
  button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 10px; padding: 9px 12px; }
  button.primary { width: 100%; border: none; background: var(--ac); color: #fff; }
  button.ghost { width: 100%; border: 1px solid var(--line); background: #fff; color: inherit; }
  button:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
  .empty { border: 1px dashed var(--line); border-radius: 11px; padding: 16px; color: var(--muted); font-size: 12px; }
  footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Fireflies Live</h1>
  <p class="sub">The copilot docks here beside your call.</p>

  <div id="status" role="status" aria-live="polite"></div>
  <ul id="meetings"></ul>

  <button id="open" class="primary" type="button">Join Live</button>
  <div class="row"><button id="refresh" class="ghost" type="button">Rescan tabs</button></div>

  <footer>
    Fireflies Live opens in its own tab, not inside this panel: its session cookie is
    <code>SameSite=Strict</code>, so an embedded frame would land logged out.
    Zoom's desktop app is invisible to an extension — only its web client is listed.
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
