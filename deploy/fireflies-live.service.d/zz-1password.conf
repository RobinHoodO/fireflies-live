# /etc/systemd/system/fireflies-live.service.d/zz-1password.conf
# 1Password Phase 6 (B6). oprun resolves the three provider secrets ONCE at start from the
# address file and puts them in the process environment (app-api reads the environment first).
# The FIREFLIES_ALLOWED_* policy lists stay plaintext in SERVE_ENV_FILE and are re-read per request.
# Install / proof / revert: deploy/README.md in RobinHoodO/fireflies-live.
[Service]
ExecStart=
ExecStart=/usr/local/bin/oprun --env-file /etc/fireflies-live/op.env -- /usr/bin/node server/serve.mjs
